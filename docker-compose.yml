# ============================================
# Docker Compose 配置文件
# 视频生成系统 - 完整部署
# ============================================

version: '3.9'

services:
  # ============================================
  # 后端 API 服务
  # ============================================
  backend:
    build:
      context: ./remotion-video/server
      dockerfile: Dockerfile
    container_name: video-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    volumes:
      # 挂载配置文件（后端读取 /config.toml）
      - ./config.toml:/config.toml:ro
      # 持久化数据（同时访问 /app/data 和 /data）
      - ./data:/app/data
      - ./data:/data
      - ./assets:/app/assets
      - ./remotion-video/server/assets/chrome-headless:/app/assets/chrome-headless
      - ./outputs:/app/outputs
      - ./logs:/app/logs
      # 配置覆盖文件 (可选)
      - ./remotion-video/server/config.override.json:/app/remotion-video/server/config.override.json:ro
      # Remotion 渲染所需的完整项目目录（含 node_modules）
      - ./remotion-video:/remotion:ro
    environment:
      - NODE_ENV=production
      - PORT=3001
      - REMOTION_PROJECT_DIR=/remotion
      # 使用挂载的 chrome-headless-shell-linux64
      - CHROME_EXECUTABLE_PATH=/app/assets/chrome-headless/chrome-headless-shell-linux64/chrome-headless-shell

    networks:
      - video-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================
  # 前端服务
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: video-frontend
    restart: unless-stopped
    volumes:
      - ./assets:/usr/share/nginx/html/assets
      - ./outputs:/usr/share/nginx/html/outputs
    ports:
      - "${FRONTEND_PORT:-80}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - video-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ============================================
  # Nginx 反向代理 (可选，用于 HTTPS)
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: video-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
      - "${NGINX_HTTPS_PORT:-8443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - video-network
    profiles:
      - with-nginx

networks:
  video-network:
    driver: bridge

volumes:
  data:
  assets:
  outputs:
  logs:
