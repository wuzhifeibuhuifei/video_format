[volcengine]
# 大模型 API 端点 URL (用于语义匹配)
api_url = "https://ark.cn-beijing.volces.com/api/v3/chat/completions"

# API 密钥
api_key = "16d75df9-fd0f-4270-bae4-133f1b984ec9"

# 模型名称（可选，根据API要求配置）
model = "deepseek-v3-2-251201"

[video]
# 视频比例 (可选值: "16:9", "9:16", "4:3", "1:1")
# 16:9 - 横屏 (1920x1080)
# 9:16 - 竖屏 (1080x1920)
# 4:3 - 传统电视 (1440x1080)
# 1:1 - 方形 (1080x1080)
aspect_ratio = "16:9"

[timing]
# 每个分镜的基础时长（秒）- 如果API调用失败时使用
base_duration = 3.0

# 每个字符的平均阅读时长（秒）- 备用计算方式
chars_per_second = 0.25

# 最小分镜时长（秒）
min_duration = 2.0

# 最大分镜时长（秒）
max_duration = 8.0

# 转场效果时长（秒）
transition_duration = 0.1

# 字幕整体延迟（秒），正值表示字幕整体向后延迟
subtitle_delay = 0

[video_effects]
# 是否启用镜头动态效果（Ken Burns 效果）
enable_movement = true

# 缩放效果：场景结束时的放大比例（1.0 = 无缩放，1.15 = 放大15%）
# 抖音短视频建议：1.12-1.18 之间，更强的视觉冲击
zoom_ratio = 1.12

# 平移效果：水平移动距离（像素，正数向右，负数向左）
# 抖音短视频建议：50-80 像素，增强动感
pan_x_range = 50

# 平移效果：垂直移动距离（像素，正数向下，负数向上）
# 抖音短视频建议：50-80 像素，增强动感
pan_y_range = 50

# 运动模式："random" | "zoom_in" | "zoom_out" | "pan_left" | "pan_right" | "pan_up" | "pan_down"
# 抖音短视频建议：使用 "zoom_in" 制造紧迫感，或 "random" 增加变化
movement_type = "zoom_in"

# 是否显示字幕
enable_subtitle = false

[audio_effects]
# 是否启用背景音乐
enable_bgm = true

# 背景音乐文件路径（相对于项目根目录）
bgm_path = "assets/audio/background_music.mp3"

# 背景音乐音量（0.0-1.0）
# 建议：知识类视频使用 0.15-0.25，避免喧宾夺主
bgm_volume = 0.2

# 是否循环播放背景音乐（如果BGM短于视频时长）
bgm_loop = true

# BGM淡入时长（秒）
bgm_fadein = 2.0

# BGM淡出时长（秒）
bgm_fadeout = 3.0

[aliyun_asr]
# 阿里云录音文件识别极速版配置
# 获取方式:
# 1. 登录阿里云控制台: https://nls-portal.console.aliyun.com/
# 2. 创建项目并获取AppKey
# 3. 获取Token: https://nls-portal.console.aliyun.com/applist

# 应用AppKey（必填）
appkey = "IRJDd8ke1ttfH367"

# API Token（必填，注意Token有有效期，需要定期更新）
token = "8e8f42f771224c0e85107da0a46c77a2"

# 区域（可选，默认cn-shanghai）
# 可选值: cn-shanghai, cn-beijing, cn-shenzhen
region = "cn-shanghai"

[minimax_speech]
# MiniMax 语音 API 信息
api_url = "https://api.minimaxi.com/v1/t2a_v2"
# 国内的api
api_key = "sk-api-lV3wuqTOseuGfM5QAOTFi1HboXo6K07E0IqMRGQHnHBusugzZddZZlExt9W1fRbgPAo4m___AxoWW9aGYfSojUHV_EuQuNpUBMHy3s8KeiD24zoYWZ_r0ek"

# 音色克隆 API 密钥（中国国内节点 minimaxi.com）
# 如果未设置，将使用上面的 api_key
clone_api_key = "sk-api-lV3wuqTOseuGfM5QAOTFi1HboXo6K07E0IqMRGQHnHBusugzZddZZlExt9W1fRbgPAo4m___AxoWW9aGYfSojUHV_EuQuNpUBMHy3s8KeiD24zoYWZ_r0ek"

model = "speech-2.6-hd"

[minimax_speech.voice_setting]
# 官方文档列出的 voice_id，例如 male-qn-qingse
voice_id = "Chinese (Mandarin)_Unrestrained_Young_Man"
speed = 1.1
vol = 1.0
pitch = 0.0

[minimax_speech.audio_setting]
sample_rate = 32000
bitrate = 128000
format = "mp3"
channel = 1
subtitle_enable = false
aigc_watermark = false

[workflow]
# 默认分镜数量
default_scene_count = 8
# 默认故事风格
default_story_tone = "真诚有态度"
# 默认全局画面风格提示
default_image_style = "简笔画风格，白色线条手绘，纯色克莱因蓝背景(#002FA7)，极简主义，干净利落的线条，儿童绘本插画感，画面人物使用火柴人形象"
# 默认负面提示词
default_negative_prompt = "low quality, blurry, distorted anatomy, watermark"
# 自动生成的项目图片目录（实际路径会以项目ID拼接子目录）
image_root = "assets/images/projects"
# 自动保存的音频输出目录
audio_root = "assets/audio/generated"
# 自动保存的视频输出目录
video_root = "outputs"

[auth]
# 是否启用 HTTP Basic Auth 认证
enable = true
# 用户名
username = "admin"
# 密码（建议部署时修改为强密码）
password = "video2024"

[database]
path = "data/projects.db"

[comfyui]
enable_auto_generate = false
base_url = "http://127.0.0.1:8188"
model_name = "z_image_turbo"
width = 832
height = 1216
seed = 1024
steps = 20
cfg = 3.5
workflow_file = "d:/comfyUI/workflows/image_z_image_turbo.json"

[remotion]
# Remotion 渲染服务配置
enable = true
# 渲染服务地址
server_url = "http://127.0.0.1:3001"
# 帧率
fps = 24

[volcengine_video]
# 火山引擎视频生成 API 配置 (Doubao-Seedance)
# 文档: https://www.volcengine.com/docs/82379/1520757

# 是否启用视频生成
enable = true

# API 密钥（与图片生成共用）
api_key = "16d75df9-fd0f-4270-bae4-133f1b984ec9"

# 模型端点
model_endpoint = "doubao-seedance-1-0-pro-fast-251015"

# 轮询间隔（毫秒）
poll_interval = 5000

# 最大等待时间（毫秒）
max_poll_time = 300000

[volcengine_image]
# 火山引擎文生图 API 配置
# 文档: https://www.volcengine.com/docs/6791/1361336

# 是否启用火山引擎生图
enable = true

# === ARK SDK 配置（推荐方式）===
# 使用 ARK Runtime SDK，更简洁
use_ark_sdk = true
# API 密钥（从火山引擎控制台获取）
api_key = "16d75df9-fd0f-4270-bae4-133f1b984ec9"
# 模型端点 ID（如 ep-xxx-seedream）
model_endpoint = "doubao-seedream-4-5-251128"

# === CVProcess API 配置（旧版方式）===
api_url = "https://visual.volcengineapi.com"
access_key = ""
secret_key = ""
# 模型版本: general_v2.0, general_v2.0_L, anime_v1.3 等
model_version = "general_v2.0_L"

# === 通用配置 ===
# 图片尺寸（doubao-seedream 要求至少 3686400 像素，16:9 使用 2560x1440）
width = 2560
height = 1440
# 生成参数
scale = 7.0
seed = -1
ddim_steps = 25
# 是否添加水印
watermark = false
